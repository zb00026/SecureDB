plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.verlake.dam'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web:3.+'
	implementation 'org.springframework.boot:spring-boot-devtools:3.+'
	testImplementation 'org.springframework.boot:spring-boot-starter-test:3.+'
	implementation 'org.liquibase:liquibase-core:4.+'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
	runtimeOnly 'mysql:mysql-connector-java:8.+'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.+'
	implementation 'org.projectlombok:lombok:1.+'
	annotationProcessor 'org.projectlombok:lombok:1.+'
	implementation 'org.springframework.boot:spring-boot-starter-security:3.+'
	implementation 'org.keycloak:keycloak-spring-boot-starter:23.+'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client:3.+'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server:3.+'
	implementation 'org.springframework.security:spring-security-oauth2-jose:6.+'
	implementation 'org.slf4j:slf4j-api:2.+'
	implementation 'ch.qos.logback:logback-classic:1.+'
	implementation 'net.logstash.logback:logstash-logback-encoder:7.+'
	testImplementation 'org.testcontainers:testcontainers:1.+'
	testImplementation 'org.testcontainers:junit-jupiter:1.+'
	testImplementation 'org.testcontainers:mysql:1.+'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << "-parameters";
}