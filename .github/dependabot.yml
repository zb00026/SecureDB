version: 2
ignore:
  - dependency-name: "jakarta.persistence:jakarta.persistence-api"
    versions: ["3.x"]
updates:
  - package-ecosystem: "gradle"
    directory: "/" # Adjust if your Gradle files are in a subdirectory
    schedule:
      interval: "monthly" # Options: daily, weekly, or monthly
    allow:
      - dependency-name: "jakarta.persistence:jakarta.persistence-api"
        versions: ["3.1.0"] # Explicitly allow only version 3.1.0 to be used