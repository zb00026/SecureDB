name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      docker:
        image: docker:24.0
    env:
      MYSQL_URL: jdbc:mysql://localhost:3306/dam
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: 
      KEYCLOAK_URL: http://localhost:8081
    steps:
      # Check out the code from the repository
      - uses: actions/checkout@v4

      # Install Docker Compose
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # Set up Docker Compose
      - name: Set up Docker Compose
        run: |
          docker-compose -f .github/docker-compose.yml up -d

      # Wait for services
      - name: Wait for MySQL and Keycloak
        run: |
          echo "Waiting for MySQL to be ready..."
          timeout 120s bash -c 'while ! mysqladmin ping -h127.0.0.1 --silent; do sleep 5; done'
        shell: bash

      - name: Wait for Keycloak to be ready
        run: |
          echo "Waiting for Keycloak to be ready..."
          timeout 120s bash -c 'until curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/realms/master | grep -q "200"; do
            echo "Waiting for Keycloak to be ready..."; sleep 5;
          done'

      - name: Display Keycloak Logs
        run: docker logs github_keycloak_1 || true

      # Set up Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Import Keycloak Realm Configuration
      - name: Setup Keycloak Realm
        run: |
          echo "Fetching admin token..."
          TOKEN=$(curl -s -X POST http://localhost:8081/realms/master/protocol/openid-connect/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=admin" \
            -d "password=admin" \
            -d "grant_type=password" \
            -d "client_id=admin-cli" | jq -r '.access_token')

          # Verify if token is retrieved
          if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
            echo "Failed to retrieve Keycloak admin token!"
            exit 1
          fi

          echo "Successfully retrieved Keycloak admin token."

          # Create Keycloak realm
          echo "Setting up Keycloak realm..."
          curl -s -X POST http://localhost:8081/admin/realms \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@src/main/resources/keycloak/realm-export.json"

          echo "Keycloak realm setup completed!"

      # Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Cache Gradle dependencies
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Set up Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.0.0

      # Run Gradle build
      - name: Build with Gradle Wrapper
        run: ./gradlew build --stacktrace

      # Run Tests and Capture Results
      - name: Run Tests
        run: ./gradlew test --stacktrace

      # Publish Test Results
      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: build/test-results/test