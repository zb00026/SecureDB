name: Run E2E Tests on QA Environment

on:
  schedule:
    # Runs every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  
jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Load .env variables
        run: |
          # Load the .env file
          set -o allexport
          source .env
          set +o allexport
          # Save the variables to GITHUB_ENV
          echo "HOST_IP_ADDRESS=$HOST_IP_ADDRESS" >> $GITHUB_ENV
          echo "HOST_REGION=$HOST_REGION" >> $GITHUB_ENV
          echo "MYSQL_USERNAME=$MYSQL_USERNAME" >> $GITHUB_ENV
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> $GITHUB_ENV
          echo "HOST_USER=$HOST_USER" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible and MySQL dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible pymysql

      - name: Generate inventory.ini from template
        run: |
          export HOST_IP_ADDRESS=${{ env.HOST_IP_ADDRESS }}
          export HOST_USER=${{ env.HOST_USER }}
          envsubst < ansible/inventory.ini.j2 > ansible/inventory.ini
          cat ansible/inventory.ini

      - name: Set up SSH for EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.HOST_IP_ADDRESS }} >> ~/.ssh/known_hosts

      - name: Seed E2E test database
        run: |
          ansible-playbook ansible/seed-e2e-db.yml \
            --inventory ansible/inventory.ini \
            -e "mysql_user=${{ env.MYSQL_USERNAME }}" \
            -e "mysql_password=${{ secrets.MYSQL_PASSWORD }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'  # Added cache for better performance

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2  # Updated from wrapper-validation-action
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run E2E tests
        env:
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_USER_PASSWORD }}
        run: |
          ./gradlew e2eTest --tests "com.verlake.dam.e2etest.test.E2ETestSuite" --rerun-tasks -Dtest.profile=qa

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            build/reports/tests/e2eTest/
            build/test-results/e2eTest/
            /home/runner/work/DAM/DAM/screenshots/
          retention-days: 14

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v4  # Added test report publishing
        with:
          report_paths: 'build/test-results/e2eTest/TEST-*.xml'
          detailed_summary: true
          include_passed: true

      - name: Transfer files to server
        if: always()
        run: |
          # Create a zip file of test results and screenshots
          zip -r test-results.zip build/reports/tests/e2eTest/ build/test-results/e2eTest/ /home/runner/work/DAM/DAM/screenshots/
          
          # Create directory on server if it doesn't exist
          ssh -i ~/.ssh/id_rsa ${{ env.HOST_USER }}@${{ env.HOST_IP_ADDRESS }} "mkdir -p /home/${{ env.HOST_USER }}/e2e-test-results"
          
          # Transfer zip file to server
          scp -i ~/.ssh/id_rsa test-results.zip ${{ env.HOST_USER }}@${{ env.HOST_IP_ADDRESS }}:/home/${{ env.HOST_USER }}/e2e-test-results/
