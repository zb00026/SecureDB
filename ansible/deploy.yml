---
- name: Deploy Backend on EC2 Instance
  hosts: ec2
  become: true
  tasks:
    - name: Install boto3 and botocore Python libraries
      pip:
        name:
          - boto3
          - botocore
        state: latest

    - name: Printing backend artifact
      shell:
        echo "{{ lookup('env', 'BACKEND_ARTIFACT_PREFIX') }}-{{ lookup('env', 'timestamp') }}.zip"

    - name: Ensure the backend directory exists
      file:
        path: "/var/spring_backend"
        state: directory
        mode: '0770'
        owner: "{{ lookup('env', 'HOST_USER') }}"
        group: "{{ lookup('env', 'HOST_USER') }}"

    - name: Ensure the backend directory exists
      file:
        path: "/var/spring_backend/backend"
        state: directory
        mode: '0770'
        owner: "{{ lookup('env', 'HOST_USER') }}"
        group: "{{ lookup('env', 'HOST_USER') }}"

    - name: Stop any existing Java processes
      shell: |
        pkill -f 'java -jar /var/spring_backend/backend/DAM-0.0.1-SNAPSHOT.jar'
        sudo systemctl stop dam_backend
      ignore_errors: yes

    # Skip S3 download for manual testing - files are already in place
    - name: Check if JAR file exists (for manual testing)
      stat:
        path: "/var/spring_backend/backend/DAM-0.0.1-SNAPSHOT.jar"
      register: jar_file_check

    - name: Fail if JAR file not found
      fail:
        msg: "DAM-0.0.1-SNAPSHOT.jar not found in /var/spring_backend/backend/. Please ensure files are copied manually."
      when: not jar_file_check.stat.exists

    - name: Change ownership of backend directory
      file:
        path: /var/spring_backend/backend
        owner: "{{ lookup('env', 'HOST_USER') }}"
        group: "{{ lookup('env', 'HOST_USER') }}"
        recurse: yes

    - name: Stop DAM Backend service if running
      systemd:
        name: dam_backend
        state: stopped
      ignore_errors: yes

    - name: Create DAM Backend systemd service file
      copy:
        dest: /etc/systemd/system/dam_backend.service
        content: |
          [Unit]
          Description=Spring Boot DAM Backend Application
          After=syslog.target
          After=network.target

          [Service]
          User={{ lookup('env', 'HOST_USER') }}
          Group={{ lookup('env', 'HOST_USER') }}
          WorkingDirectory=/var/spring_backend/backend
          ExecStart=/usr/bin/java -jar /var/spring_backend/backend/DAM-0.0.1-SNAPSHOT.jar --spring.profiles.active=qa
          SuccessExitStatus=143
          TimeoutStopSec=10
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable DAM Backend service
      systemd:
        name: dam_backend
        enabled: yes

    - name: Start DAM Backend service
      systemd:
        name: dam_backend
        state: started
      register: dam_backend_service

    - name: Debug DAM Backend Service status
      debug:
        msg: "DAM Backend Service: {{ dam_backend_service.status }}"
      when: dam_backend_service.status is defined

    - name: Check DAM Backend service status
      systemd:
        name: dam_backend
      register: backend_status

    - name: Display backend service status
      debug:
        msg: "Backend service is {{ backend_status.status.ActiveState }}"
