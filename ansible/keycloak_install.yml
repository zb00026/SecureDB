---
- name: Install KeyCloak on EC2 instance
  hosts: ec2
  become: true
  vars:
    local_keycloak_url: "http://localhost:8081"
  tasks:

    - name: Update EC2 system packages
      dnf:
        name: "*"
        state: latest
    - name: Install required packages
      dnf:
        name:
          - java-17-amazon-corretto
          - nginx
          - aws-cli
          - python3
          - python3-pip
        state: present

    #    ######## Install and configure Keycloak ########
    - name: Check if Keycloak service is already running
      shell: |
        systemctl is-active --quiet keycloak || echo "Keycloak not running"
      register: keycloak_status
      failed_when: false
      changed_when: false

    - name: Download and install Keycloak if not already installed
      when: keycloak_status.stdout == "Keycloak not running"
      shell: |
        # Download Keycloak tar.gz
        sudo wget https://github.com/keycloak/keycloak/releases/download/26.1.0/keycloak-26.1.0.tar.gz -P /opt

        # Extract the Keycloak tar.gz file
        sudo tar -xvzf /opt/keycloak-26.1.0.tar.gz -C /opt

        # Create a Keycloak user
        sudo useradd keycloak
        sudo chown -R keycloak:keycloak /opt/keycloak-26.1.0

        sudo systemctl stop keycloak
        
        # Create a service file for Keycloak
        echo "[Unit]
        Description=Keycloak Server
        After=network.target

        [Service]
        Type=simple
        User=keycloak
        Environment=KEYCLOAK_ADMIN={{ lookup('env', 'KEYCLOAK_ADMIN_USERNAME') }}
        Environment=KEYCLOAK_ADMIN_PASSWORD={{ lookup('env', 'KEYCLOAK_ADMIN_USER_PASSWORD') }}
        Environment=KC_HEALTH_ENABLED=true
        Environment=KC_METRICS_ENABLED=true
        Environment=KC_FEATURES=scripts
        ExecStart=/opt/keycloak-26.1.0/bin/kc.sh start --hostname=https://{{ lookup('env', 'HOST_DOMAIN') }} --http-enabled=true --hostname-strict=false --http-port=8081 --spi-script-upload-enabled=true
        Restart=on-failure
        LimitNOFILE=10240

        [Install]
        WantedBy=multi-user.target" | sudo tee /etc/systemd/system/keycloak.service > /dev/null

        # Reload systemd to apply the service
        sudo systemctl daemon-reload
        sudo systemctl enable keycloak

        # Start Keycloak service
        sudo systemctl start keycloak

        # Wait until Keycloak is fully up before continuing
        until curl -s {{ local_keycloak_url }}/realms/master; do
        echo "Waiting for Keycloak to be fully ready..."
        sleep 5
        done
        
        echo "Keycloak is ready."

    - name: Wait for Keycloak to be ready
      uri:
        url: "{{ local_keycloak_url }}/realms/master"
        method: GET
        status_code: 200
        return_content: yes
      register: keycloak_ready
      retries: 24  # Number of retries
      delay: 10    # Delay in seconds between retries
      until: keycloak_ready.status == 200
      ignore_errors: yes

    - name: Check if Keycloak realm exists
      uri:
        url: "{{ local_keycloak_url }}/realms/{{ lookup('env', 'KEYCLOAK_REALM_NAME') }}"
        method: GET
        return_content: yes
        status_code: 200
      register: realm_check
      failed_when: realm_check.status != 200 or "'Realm does not exist' in realm_check.content"
      ignore_errors: yes

    - name: Create Keycloak root admin user token
      shell: |
        curl -s -X POST {{ local_keycloak_url }}/realms/master/protocol/openid-connect/token -d 'username={{ lookup('env', 'KEYCLOAK_ADMIN_USERNAME') }}' -d 'password={{ lookup('env', 'KEYCLOAK_ADMIN_USER_PASSWORD') }}' -d 'grant_type=password' -d 'client_id=admin-cli' | jq -r '.access_token'
      register: keycloak_token
      failed_when: "'error' in keycloak_token.stderr"
      ignore_errors: yes  # To continue even if it fails for debugging purposes

    - name: Debug Keycloak root admin token output to import realm json
      debug:
        msg: "Keycloak Token: {{ keycloak_token.stdout }}"
      when: keycloak_token is defined

    - name: Check if realm-export.json exists
      stat:
        path: /var/spring_backend/backend/realm-export.json
      register: realm_export_file

    - name: Import Keycloak realm from realm-export.json
      shell: |
        set -e
        echo "Attempting to import DAM realm..."
        
        # Retry logic for realm import (Keycloak API might not be fully ready)
        for attempt in {1..5}; do
          echo "Import attempt $attempt/5"
          
          response=$(curl -s -w "%{http_code}" -X POST {{ local_keycloak_url }}/admin/realms \
            -H 'Authorization: Bearer {{ keycloak_token.stdout }}' \
            -H 'Content-Type: application/json' \
            --data-binary @/var/spring_backend/backend/realm-export.json)
          
          http_code="${response: -3}"
          response_body="${response%???}"
          
          echo "HTTP Code: $http_code"
          echo "Response: $response_body"
          
          if [ "$http_code" = "201" ] || [ "$http_code" = "409" ]; then
            if [ "$http_code" = "201" ]; then
              echo "Realm imported successfully"
            else
              echo "Realm already exists (409), continuing..."
            fi
            exit 0
          elif [ "$http_code" = "401" ]; then
            echo "Authentication failed - token may be invalid"
            exit 1
          else
            echo "Import failed with HTTP $http_code, retrying in 10 seconds..."
            sleep 10
          fi
        done
        
        echo "Failed to import realm after 5 attempts"
        exit 1
      register: realm_import_result
      when: keycloak_token.stdout is defined and realm_export_file.stat.exists
      failed_when: realm_import_result.rc != 0

    - name: Display realm import result
      debug:
        msg: "Realm import output: {{ realm_import_result.stdout }}"
      when: realm_import_result is defined

    - name: Verify DAM realm was created
      uri:
        url: "{{ local_keycloak_url }}/admin/realms/DAM"
        method: GET
        headers:
          Authorization: "Bearer {{ keycloak_token.stdout }}"
        status_code: 200
      register: realm_verification
      when: keycloak_token.stdout is defined
      retries: 3
      delay: 5

    - name: Get DAM realm client list
      shell: |
        curl -s -X GET "{{ local_keycloak_url }}/admin/realms/master/clients" \
        -H "Authorization: Bearer {{ keycloak_token.stdout }}" -o /tmp/clients.json
        cat /tmp/clients.json
      register: dam_client_list
      failed_when: false
      changed_when: false

    - name: Get the dam_client_id for the DAM client
      shell: |
        jq '.[] | select(.clientId=="{{ lookup('env', 'KEYCLOAK_REALM_NAME') }}-realm") | .id' /tmp/clients.json
      register: dam_client_id
      failed_when: false
      changed_when: false
      ignore_errors: true

    - name: Display dam_client_id
      debug:
        var: dam_client_id.stdout

    - name: Get the manage-users role ID from DAM realm
      shell: |
        curl -s -X GET {{ local_keycloak_url }}/admin/realms/{{ lookup('env', 'KEYCLOAK_REALM_NAME') }}/clients/{{ dam_client_id.stdout }}/roles -H "Authorization: Bearer {{ keycloak_token.stdout }}" -o /tmp/roles.json
        jq '.[] | select(.name=="manage-users") | .id' /tmp/roles.json
      register: dam_users_management_role
      failed_when: false
      changed_when: false

    - name: Get the admin user ID from the master realm
      shell: |
        curl -s -X GET {{ local_keycloak_url }}/admin/realms/master/users -H "Authorization: Bearer {{ keycloak_token.stdout }}" -o /tmp/admin_users.json
        jq '.[] | select(.username=="admin") | .id' /tmp/admin_users.json
      register: master_admin_user_id
      failed_when: false
      changed_when: false
      ignore_errors: true

    - name: Debug dam_users_management_role ID
      debug:
        msg: "Role ID: {{ dam_users_management_role.stdout }}"

    - name: Debug master_admin_user_id ID
      debug:
        msg: "Admin User ID: {{ master_admin_user_id.stdout }}"

    - name: Assign manage-users role to the master realm admin user
      shell: |
        curl -v -s -X POST {{ local_keycloak_url }}/admin/realms/master/users/{{ master_admin_user_id.stdout }}/role-mappings/clients/{{ dam_client_id.stdout }} \
        -H "Authorization: Bearer {{ keycloak_token.stdout }}" \
        -H "Content-Type: application/json" \
        -d "[{\"id\": \"{{ dam_users_management_role.stdout | replace('\"', '') }}\", \"name\": \"manage-users\"}]"
      when: master_admin_user_id.stdout != "" and dam_users_management_role.stdout != ""
      register: role_assignment_result
      changed_when: true
      ignore_errors: true

    - name: Check if DAM admin user exists in Keycloak
      shell: |
        curl -s -X GET {{ local_keycloak_url }}/admin/realms/{{ lookup('env', 'KEYCLOAK_REALM_NAME') }}/users -H "Authorization: Bearer {{ keycloak_token.stdout }}" -o /tmp/response.json
        jq '.[] | select(.username=="admin") | .username' /tmp/response.json
      register: admin_user_check
      failed_when: false
      changed_when: false
      ignore_errors: true

    - name: Checking DAM Admin User Exist Result
      debug:
        msg: "DAM Admin User Exist: {{ admin_user_check.stdout }}"
      when: admin_user_check is defined

    - name: Get the manage-account role ID from account client
      shell: |
        # First get account client ID
        account_client_id=$(curl -s -X GET {{ local_keycloak_url }}/admin/realms/{{ lookup('env', 'KEYCLOAK_REALM_NAME') }}/clients \
        -H "Authorization: Bearer {{ keycloak_token.stdout }}" | jq -r '.[] | select(.clientId=="account") | .id')
        
        # Then get manage-account role ID
        curl -s -X GET {{ local_keycloak_url }}/admin/realms/{{ lookup('env', 'KEYCLOAK_REALM_NAME') }}/clients/$account_client_id/roles \
        -H "Authorization: Bearer {{ keycloak_token.stdout }}" | jq -r '.[] | select(.name=="manage-account") | .id'
      register: manage_account_role
      failed_when: false
      changed_when: false

    - name: Debug manage-account role ID
      debug:
        msg: "Manage Account Role ID: {{ manage_account_role.stdout }}"

    - name: Create DAM admin user if not exist in Keycloak
      shell: |
        # First create the user
        user_response=$(curl -s -X POST {{ local_keycloak_url }}/admin/realms/{{ lookup('env', 'KEYCLOAK_REALM_NAME') }}/users \
        -H "Authorization: Bearer {{ keycloak_token.stdout }}" \
        -d "{\"username\": \"{{ lookup('env', 'KEYCLOAK_ADMIN_USERNAME') }}\", \
          \"enabled\": true, \
          \"firstName\": \"Admin\", \
          \"lastName\": \"Admin\", \
          \"email\": \"chuc06872@gmail.com\", \
          \"credentials\": [{ \
            \"type\":\"password\", \
            \"value\":\"{{ lookup('env', 'KEYCLOAK_ADMIN_USER_PASSWORD') }}\", \
            \"temporary\":false \
          }]}" -H 'Content-Type: application/json' -D -)

        # Extract user ID from Location header
        user_id=$(echo "$user_response" | grep -i 'Location' | sed -e 's/.*\/\([^/]*\)$/\1/')
        echo "Extracted user ID: $user_id"
        
      register: create_user_response
      ignore_errors: yes

    - name: Display create_user_response result
      debug:
        var: create_user_response

    - name: Ignore Keycloak HTTPS service
      shell: |
        sudo /opt/keycloak-26.1.0/bin/kcadm.sh config credentials --server {{ local_keycloak_url }} --realm master --user {{ lookup('env', 'KEYCLOAK_ADMIN_USERNAME') }} --password {{ lookup('env', 'KEYCLOAK_ADMIN_USER_PASSWORD') }}
        sudo /opt/keycloak-26.1.0/bin/kcadm.sh update realms/master -s sslRequired=NONE
        sudo /opt/keycloak-26.1.0/bin/kcadm.sh update realms/DAM -s sslRequired=NONE

