spring.config.import=optional:file:.env[.properties]spring.config.import=optional:file:.env[.properties]
spring.application.name=DAM

# Database Configuration
# Set DATABASE_TYPE environment variable to: mysql, postgresql, or mssql
# The appropriate database configuration will be loaded automatically
spring.profiles.include=${DATABASE_TYPE:mysql}

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

## Keycloak
spring.security.oauth2.client.registration.keycloak.client-id=backend-client
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.scope=openid
keycloak.realm=DAM

## Google
google.oauth2.issuer-uri=https://accounts.google.com
google.oauth2.jwks-uri=https://www.googleapis.com/oauth2/v3/certs

auth.provider=${AUTH_PROVIDER}

## Log4j
logging.level.root=INFO
logging.level.com.verlake.dam=DEBUG
logging.file.name=logs/dev-application.log
logging.config=classpath:logback-spring.xml

## Email
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.region=${HOST_REGION}

## Audit Trail
audit.retention-days=${AUDIT_RETENTION_DAYS:30}

notification.job.chunk-size=10
notification.job.max-retry-attempts=3
notification.job.retry-delay=1000
notification.job.firebase.timeout-ms=5000

# Firebase Configuration
firebase.config.path=firebase/firebase-config.json

# System Identifier Configuration
# Override the automatically generated system identifier with a manual value
# This is useful when the automatic generation is not stable enough
# Example: system.identifier.override=MY-CUSTOM-SYSTEM-ID
system.identifier.override=

# Whether to include MAC address in system identifier generation
# Set to false if MAC addresses are too volatile on your system
# Default: true
system.identifier.use-mac-address=false

# License Configuration
# Number of days before expiry to show warning
license.expiry.warning.days=10

# Resource license filename (fallback when no database license exists)
license.resource.filename=DevLicense.bin

# License upload configuration
license.upload.max-size-mb=10
license.upload.allowed-extensions=.bin,.license

# Spring Batch Configuration
spring.batch.job.enabled=true 
# JWT Configuration for Password Reset
jwt.secret=${JWT_SECRET:zHHOPwF5ysBFbLA/tHufGMDk9nacd+YWclXvIp4Ii9o=}
jwt.password-reset.expiration-hours=24

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.model.name=gemini-2.5-flash
gemini.max.tokens=4096
gemini.temperature=0.7
gemini.top.k=40
gemini.top.p=0.95
gemini.retry.max-attempts=2
gemini.retry.base-delay-ms=500
gemini.retry.max-delay-ms=4000

# Model-specific settings
gemini.model.version=2.5
gemini.model.supports-multimodal=true
gemini.response.debug-logging=true

# AI Chat Configuration
ai.chat.session.timeout-minutes=60
ai.chat.max.messages.per.session=50
ai.chat.enable.suggestions=true
ai.chat.confidence.threshold=0.75
ai.masking.enable.auto-detection=true
ai.masking.enable.sample-data=false
ai.masking.sample-data.timeout-ms=5000

# Request/Response Logging Configuration
# Set to true to enable detailed request/response logging (headers, body, etc.)
# Set to false for basic logging only (method, URL, status, timing)
logging.detailed.request.response.enabled=${DETAILED_LOGGING_ENABLED:false}




spring.datasource.url=jdbc:mysql://localhost:3306/dam?characterEncoding=utf8&useUnicode=true&allowMultiQueries=true&maxAllowedPacket=67108864&useServerPrepStmts=false&rewriteBatchedStatements=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true 