spring.config.import=optional:file:.env[.properties]spring.config.import=optional:file:.env[.properties]
spring.application.name=DAM
spring.datasource.url=${MYSQL_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

## Keycloak
spring.security.oauth2.client.registration.keycloak.client-id=backend-client
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.scope=openid
keycloak.realm=DAM

## Google
google.oauth2.issuer-uri=https://accounts.google.com
google.oauth2.jwks-uri=https://www.googleapis.com/oauth2/v3/certs

auth.provider=${AUTH_PROVIDER}

## Log4j
logging.level.root=INFO
logging.level.com.verlake.dam=DEBUG
logging.file.name=logs/dev-application.log
logging.config=classpath:logback-spring.xml

## Email
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.region=${HOST_REGION}

## Audit Trail
audit.retention-days=${AUDIT_RETENTION_DAYS:30}

notification.job.chunk-size=10
notification.job.max-retry-attempts=3
notification.job.retry-delay=1000
notification.job.firebase.timeout-ms=5000

# Firebase Configuration
firebase.config.path=firebase/firebase-config.json

# System Identifier Configuration
# Override the automatically generated system identifier with a manual value
# This is useful when the automatic generation is not stable enough
# Example: system.identifier.override=MY-CUSTOM-SYSTEM-ID
system.identifier.override=

# Whether to include MAC address in system identifier generation
# Set to false if MAC addresses are too volatile on your system
# Default: true
system.identifier.use-mac-address=false

# License Configuration
# Number of days before expiry to show warning
license.expiry.warning.days=10

# Resource license filename (fallback when no database license exists)
license.resource.filename=DevLicense.bin

# License upload configuration
license.upload.max-size-mb=10
license.upload.allowed-extensions=.bin,.license