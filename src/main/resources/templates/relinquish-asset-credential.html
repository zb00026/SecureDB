<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relinquish Asset Credential</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .header {
            background-color: #4CAF50;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px 8px 0 0;
        }
        .content {
            padding: 20px;
        }
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 0.9em;
            color: #777;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Relinquish Asset Credential Notification</h2>
    </div>
    <div class="content">
        <p>Dear <strong th:text="${adminName}"></strong>,</p>
        <p>We would like to inform you that <strong th:text="${ownerName}"></strong> has relinquished the ownership of asset <strong th:text="${assetName}"></strong>.</p>
    </div>
    <div class="footer">
        <p>&copy; 2025 DAM Application. All rights reserved.</p>
    </div>
</div>
</body>
</html>
