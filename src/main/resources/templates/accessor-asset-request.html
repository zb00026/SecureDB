<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessor Asset Access Request</title>
    <th:block th:replace="~{fragments/email-styles :: common-email-styles}"></th:block>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>New Asset Access Request</h2>
    </div>
    <div class="content">
        <p>Dear <strong th:text="${receiverFirstName + ' ' + receiverLastName}"></strong>,</p>
        
        <p><strong th:text="${requestorFirstName + ' ' + requestorLastName}"></strong> has requested access to the following asset:</p>
        
        <div class="details">
            <p><strong>Asset Name:</strong> <span th:text="${assetName}"></span></p>
            <p><strong>Description:</strong> <span th:text="${assetDescription}"></span></p>
        </div>
        
        <p>Please review and take appropriate action on this request.</p>
        <p>You can access the request through the DAM application.</p>
    </div>
    <div class="footer">
        <p>&copy; 2026 DAM Application. All rights reserved.</p>
    </div>
</div>
</body>
</html>
