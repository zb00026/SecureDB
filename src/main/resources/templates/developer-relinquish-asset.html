<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessor Asset Relinquishment Notification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .header {
            background-color: #2196F3;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px 8px 0 0;
        }
        .content {
            padding: 20px;
        }
        .details {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 0.9em;
            color: #777;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Asset Access Relinquishment Notice</h2>
    </div>
    <div class="content">
        <p>Dear <strong th:text="${receiverFirstName + ' ' + receiverLastName}"></strong>,</p>
        
        <p><strong th:text="${requestorFirstName + ' ' + requestorLastName}"></strong> has relinquished access to the following asset:</p>
        
        <div class="details">
            <p><strong>Asset Name:</strong> <span th:text="${assetName}"></span></p>
            <p><strong>Description:</strong> <span th:text="${assetDescription}"></span></p>
        </div>
        
        <p>The user no longer has access to this asset. No further action is required.</p>
        <p>You can review this change through the DAM application.</p>
    </div>
    <div class="footer">
        <p>&copy; 2025 DAM Application. All rights reserved.</p>
    </div>
</div>
</body>
</html>
