<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Approval Notification</title>
    <th:block th:replace="~{fragments/email-styles :: common-email-styles}"></th:block>
</head>
<body>
<div class="container">
    <div class="header green">
        <h2>Asset Approval Notification</h2>
    </div>
    <div class="content">
        <p>Dear <strong th:text="${approverName}"></strong>,</p>
        <p>This is to notify you that the asset "<strong th:text="${assetName}"></strong>" has been <strong th:text="${method}"></strong> the system.</p>
        <p>Thank you for your attention to this matter.</p>
    </div>
    <div class="footer">
        <p>&copy; 2026 DAM Application. All rights reserved.</p>
    </div>
</div>
</body>
</html>
